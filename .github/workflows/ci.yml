name: CI

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging

permissions:
  contents: read

jobs:
  database-tests:
    name: Database migrations and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estampados_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estampados_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            scripts/import/requirements.txt
            scraping/requirements.txt
            scripts/evals/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/import/requirements.txt
          python -m pip install -r scraping/requirements.txt
          python -m pip install -r scripts/evals/requirements.txt

      - name: Run Python unit tests
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s scraping/residential_properties -p "test*.py"

      - name: Run repository auditor
        run: python scripts/audit_change.py --all

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # El contenedor postgres no trae los roles anon/authenticated/service_role
      # ni el esquema auth. Las migraciones 011, 018, 019 y 020 los revocan sin
      # guarda, y la migracion de acceso a la consola usa auth.uid().
      - name: Bootstrap Supabase roles and auth schema
        run: psql -v ON_ERROR_STOP=1 -f database/ci/bootstrap_supabase_roles.sql "$DATABASE_URL"

      - name: Verify migration runner fails closed
        shell: pwsh
        run: ./scripts/test_migration_runner_failure.ps1

      - name: Apply migrations
        shell: pwsh
        run: ./scripts/apply_pending_migrations.ps1

      # Los tests SQL ya son hermeticos, pero los evals siguen necesitando un
      # producto base persistente porque se ejecutan despues de migraciones sobre
      # una base limpia. Esta semilla vive fuera de database/migrations para no
      # alterar el runner de esquema.
      - name: Apply test seeds
        run: psql -v ON_ERROR_STOP=1 -f database/seeds/001_producto_fixture_base.sql "$DATABASE_URL"

      - name: Run database tests
        shell: pwsh
        run: ./scripts/run_db_tests.ps1

      # Necesita las migraciones ya aplicadas (fn_ai_*, 045), por eso corre
      # aqui y no en el paso "Run Python unit tests" de mas arriba, que se
      # ejecuta antes de que exista ninguna migracion en la base.
      - name: Run AI evals (Cliente 360)
        run: python -m unittest scripts.evals.run_evals -v

  frontend-checks:
    name: Frontend and static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Check privileged key exposure
        working-directory: web
        run: npm run check:privilegios

      - name: Run frontend unit checks
        working-directory: web
        run: npm run test

      - name: Verify Next.js build
        working-directory: web
        run: npm run verificar
