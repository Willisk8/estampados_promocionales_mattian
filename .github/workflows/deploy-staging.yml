name: Deploy Staging

on:
  push:
    branches:
      - staging
    paths:
      - 'database/migrations/**.sql'
      - 'database/tests/**.sql'
      - 'scripts/*.ps1'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.SUPABASE_STAGING_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Validate staging database secret
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_STAGING_DATABASE_URL"
            exit 1
          fi

      - name: Apply pending migrations
        shell: pwsh
        run: ./scripts/apply_pending_migrations.ps1

      - name: Run database tests
        shell: pwsh
        run: ./scripts/run_db_tests.ps1 -ConfirmStaging
